# Career Assistant — standalone self-hosted stack (app + Postgres + nginx).
#
# This is the canonical single-host deployment: Docker Compose is the process
# supervisor, nginx routes traffic and terminates TLS. Mirrors Health
# Assistant's docker-compose.standalone.yml.
#
#   cp docker/.env.production.example docker/.env   # then edit secrets
#   docker compose -f docker/docker-compose.standalone.yml up -d --build
#
# TLS: mount docker/nginx-TLS.conf over nginx.conf, uncomment the 443
# mapping, and provide certs (see docker/README.md → TLS). HTTP-only by
# default — fine for loopback/VPN, not for the open internet.

name: career-assistant

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career}
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career} -d ${POSTGRES_DB:-career}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - career-assistant-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${CAREER_IMAGE:-career-assistant:local}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-career}
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET in docker/.env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # Same-origin SPA + API → CORS stays empty; add origins only for split
      # deployments (e.g. "https://app.example.com").
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # No host ports: all traffic is routed via the nginx service.
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - career-assistant-network

  backup:
    # Scheduled instance backups (database dump + uploads) written to the
    # ./backups bind mount. Enable with --profile backup.
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-career}
      POSTGRES_USER: ${POSTGRES_USER:-career}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
    command: >
      sh -c 'while true; do
        ts=$$(date -u +%Y%m%d-%H%M%S);
        pg_dump -U $$POSTGRES_USER -Fc $$POSTGRES_DB > /backups/db-$$ts.dump;
        find /backups -name "db-*.dump" | sort | head -n -$$BACKUP_KEEP | xargs -r rm --;
        sleep $$((BACKUP_INTERVAL_HOURS * 3600));
      done'
    logging: *default-logging
    networks:
      - career-assistant-network

  nginx:
    image: nginx:alpine
    container_name: career-assistant-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      # Uncomment when serving TLS (see nginx-TLS.conf):
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS variant (also swap the conf mount above):
      # - ./nginx-TLS.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    logging: *default-logging
    networks:
      - career-assistant-network

volumes:
  db_data:
  uploads_data:

networks:
  career-assistant-network:
    driver: bridge
