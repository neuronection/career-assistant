<html lang="en"><head><title>JOIN (Barcelona): Engineering Manager</title>
<script type="application/ld+json" id="job-posting">{"@context":"https://schema.org","@type":"JobPosting","datePosted":"2025-08-29T16:34:57.775Z","baseSalary":{"@type":"MonetaryAmount","currency":"EUR","value":{"@type":"QuantitativeValue","minValue":90000,"maxValue":105000,"unitText":"YEAR"}},"description":"\u003Cp>\u003Cstrong>Why this role matter\u003C/strong>\u003C/p>\u003Cp>JOIN helps thousands of businesses find the right people – faster, fairer, and with less friction. Our platform handles millions of candidate interactions, and our clients praise JOIN’s attention to detail and unmatched user experience.\u003C/p>\u003Cp>We’re looking for an \u003Cstrong>Engineering Manager\u003C/strong> to join our office in Barcelona. You’ll step into a mature, integrated team and help it grow even stronger: guiding engineers, improving delivery, strengthening our technical foundations, and creating the conditions for teams to ship high-quality features that tens of thousands of users rely on every day.\u003C/p>\u003Ch2>Tasks\u003C/h2>\u003Cp>\u003Cstrong>What you’ll be doing\u003C/strong>\u003C/p>\u003Cp>Your leadership will directly impact how our teams deliver software that powers hiring for thousands of companies. Here’s what that looks like:\u003C/p>\u003Cul>\u003Cli>\u003Cp>Lead and manage a team of engineers in developing and delivering high-quality software solutions.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Guide cross-functional and distributed teams to deliver results within tight deadlines.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Foster a culture of mentoring, innovation, and skill development across your team.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Set and articulate clear objectives that align with broader organizational goals.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Support your team through One-on-Ones, ensuring alignment, performance, and personal growth.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Ensure projects are delivered on time, within budget, and with a strong focus on quality and customer satisfaction.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Drive a culture of continuous learning, improvement, and collaboration.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Actively participate in interviewing and hiring engineers from diverse backgrounds.\u003C/p>\u003C/li>\u003Cli>\u003Cp>Share your knowledge, grow expertise in our product, and develop yourself alongside your team.\u003C/p>\u003C/li>\u003C/ul>\u003Cp>\u003Cstrong>Who you’ll work with\u003C/strong>\u003C/p>\u003Cp>You’ll join a diverse and growing engineering organization, collaborating closely with cross-functional teams across Product, Platform, and Design. As part of JOIN’s leadership group, you’ll be central in shaping Barcelona's hub’s culture while staying connected to teams across Europe.\u003C/p>\u003Ch2>Requirements\u003C/h2>\u003Cp>\u003Cstrong>What we’re looking for\u003C/strong>\u003C/p>\u003Cp>We don’t believe in checklists – but if most of these apply, we’d love to talk:\u003C/p>\u003Cp>✔ Minimum 5 years of experience in software engineering.\u003C/p>\u003Cp>✔ Proven track record in leading and managing engineering teams.\u003C/p>\u003Cp>✔ Strong understanding of software development processes and methodologies.\u003C/p>\u003Cp>✔ Basic knowledge in one or more of the following: Node.js, React.js, SQL, Kubernetes, GraphQL, Docker, gRPC, Pub/Sub.\u003C/p>\u003Cp>✔ Familiarity with SaaS platforms and cloud technologies.\u003C/p>\u003Cp>✔ Experience in hiring, mentoring, and developing technical talent.\u003C/p>\u003Cp>✔ Excellent communication and interpersonal skills.\u003C/p>\u003Cp>✔ Bachelor’s or Master’s degree in Computer Science, Engineering, or a related field.\u003C/p>\u003Cp>\u003Cstrong>Our Values\u003C/strong>\u003C/p>\u003Cp>❤️ People First – We put humans at the heart of hiring.\u003C/p>\u003Cp>🚀 Own It – We take initiative and solve problems independently.\u003C/p>\u003Cp>🛠 Work Smarter – Efficiency beats effort.\u003C/p>\u003Cp>💡 Be Bold – Challenge the status quo and push boundaries.\u003C/p>\u003Cp>At JOIN, we thrive in a fast-moving, collaborative environment, and we’re looking for people who do too. That means:\u003C/p>\u003Cul>\u003Cli>\u003Cp>We follow a hybrid model (3 days office, 2 remote) to promote collaboration.\u003C/p>\u003C/li>\u003Cli>\u003Cp>We adapt quickly and embrace change.\u003C/p>\u003C/li>\u003Cli>\u003Cp>We continuously challenge ourselves and each other to improve.\u003C/p>\u003C/li>\u003C/ul>\u003Cp>\u003Cstrong>This role might not be ideal if:\u003C/strong>\u003C/p>\u003Cul>\u003Cli>\u003Cp>You prefer a highly structured environment.\u003C/p>\u003C/li>\u003Cli>\u003Cp>You want a fully remote position.\u003C/p>\u003C/li>\u003Cli>\u003Cp>You prefer minimal change and a slower pace.\u003C/p>\u003C/li>\u003Cli>\u003Cp>You’re not excited about ownership and growth.\u003C/p>\u003C/li>\u003C/ul>\u003Ch2>Benefits\u003C/h2>\u003Cp>\u003Cstrong>What’s in it for you?\u003C/strong>\u003C/p>\u003Cp>🖥 Apple hardware – The best tools for the job (M3 Pro MacBook Pro).\u003C/p>\u003Cp>🏆 Team events – Brunches, sports activities, and quarterly gatherings in Berlin.\u003C/p>\u003Cp>🌍 Productivity from Everywhere – 104 days per year remote (post-probation), following our hybrid policy.\u003C/p>\u003Cp>🏦 Competitive salary – Tailored to align with your experience level.\u003C/p>\u003Cp>🏠 Relocation support – Assistance with paperwork, travel, and one month of furnished accommodation.\u003C/p>\u003Cp>🧑‍💻 Play a defining role in shaping our Barcelona hub and engineering culture.\u003C/p>\u003Cp>What to expect from the hiring process\u003C/p>\u003Cp>We respect your time and keep things transparent:\u003C/p>\u003Cp>1️⃣ Intro call (~30 min) – Let’s see if we’re a good match.\u003C/p>\u003Cp>2️⃣ Hiring Manager Review – Your profile is assessed for technical and team fit.\u003C/p>\u003Cp>3️⃣ Hiring Manager Interview (~45 min) – Dive into expectations and leadership style.\u003C/p>\u003Cp>4️⃣ Technical Interview (~60–120 min) – Show us your technical knowledge and leadership approach.\u003C/p>\u003Cp>5️⃣ Meet the Team (Optional) – Connect with your future colleagues.\u003C/p>\u003Cp>You’ll always know where you stand – no black holes, no ghosting.\u003C/p>\u003Cp>We welcome applications from individuals of all ages, abilities, genders, religions, and diverse backgrounds. If you need assistance during the hiring process or in the workplace, let us know!\u003C/p>\u003Cp>Don’t meet every requirement? No problem! We’re always open to exceptional candidates and value diversity in all forms.\u003C/p>\u003Cp>📩 Apply now – We’d love to connect with you!\u003C/p>","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","name":"JOIN","url":"https://join.com/companies/join","logo":"https://cdn.join.com/603b807305e48900015fb45c/join-solutions-ag-logo-m.png","description":"At **JOIN**, we are revolutionizing the way companies and candidates connect in the fast-paced world of recruitment. Our platform simplifies hiring, making it more efficient and accessible for businesses of all sizes, from startups to enterprises. By providing intuitive tools and leveraging cutting-edge technology, we help companies reach top talent quickly and seamlessly.\n\nWe believe that recruitment is more than just filling roles – it’s about building teams that drive innovation, growth, and success. Our diverse and passionate team is dedicated to supporting businesses through every step of the hiring journey.\n\nOur success is defined by the success of our partners, clients and candidates, and we are committed to delivering top-notch solutions that meet their unique needs. You are the only missing piece in the puzzle!","sameAs":"https://join.com"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"es","addressLocality":"Barcelona","streetAddress":"Carrer de Pere IV 105","postalCode":"08018"}},"title":"Engineering Manager","url":"https://join.com/companies/join/16890791-engineering-manage
