name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neuronection_career_test
          POSTGRES_USER: neuronection_career_owner
          POSTGRES_PASSWORD: career_dev_pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neuronection_career_owner -d neuronection_career_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://neuronection_career_owner:career_dev_pw@127.0.0.1:5433/neuronection_career_test
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (pinned revision)
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AUTH_KIT_TOKEN: ${{ secrets.AUTH_KIT_TOKEN }}
        run: |
          if [ -d ../auth-kit ]; then exit 0; fi
          if [ -n "$AUTH_KIT_TOKEN" ]; then
            url="https://x-access-token:${AUTH_KIT_TOKEN}@github.com/neuronection/auth-kit.git"
          else
            url="https://github.com/neuronection/auth-kit.git"
          fi
          rev="$(sed -n 's|^neuronection-auth-kit @ git+https://github.com/neuronection/auth-kit@\([0-9a-f]*\)$|\1|p' backend/requirements.txt)"
          if [ -z "$rev" ]; then
            echo "::error::could not read the neuronection-auth-kit pin from backend/requirements.txt"
            exit 1
          fi
          git clone "$url" ../auth-kit || {
            echo "::error::neuronection/auth-kit not fetchable — make the repo public or add a read-only AUTH_KIT_TOKEN secret (fine-grained PAT, Contents: read on neuronection/auth-kit)"
            exit 1
          }
          git -C ../auth-kit checkout --detach "$rev"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          # Bridge (see the requirements.txt header): the kit pin installs
          # from the tokened clone above; Phase 0.8 (PyPI) drops the filter.
          grep -v '^neuronection-auth-kit @' requirements.txt > /tmp/reqs.txt
          pip install -r /tmp/reqs.txt -r requirements-dev.txt
          pip install --no-deps ../../auth-kit
      - name: Lint (ruff)
        run: |
          ruff check app tests careerassistant
          ruff format --check app tests careerassistant
      - name: Migrate test database
        run: alembic upgrade head
      - name: Run tests (coverage floor, xdist-parallel)
        run: pytest tests/ -n auto --dist loadfile --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=76
      - name: Contract drift gate (identity-auth §18)
        run: pytest -m contract
      - name: OpenAPI contract diff
        run: python ../scripts/check-openapi.py --check
      - name: Type check (mypy)
        run: mypy
      - name: Dependency audit (pip-audit, advisory)
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  backend-sqlite:
    name: Backend on SQLite (desktop profile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./neuronection_career_test.db
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (pinned revision)
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AUTH_KIT_TOKEN: ${{ secrets.AUTH_KIT_TOKEN }}
        run: |
          if [ -d ../auth-kit ]; then exit 0; fi
          if [ -n "$AUTH_KIT_TOKEN" ]; then
            url="https://x-access-token:${AUTH_KIT_TOKEN}@github.com/neuronection/auth-kit.git"
          else
            url="https://github.com/neuronection/auth-kit.git"
          fi
          rev="$(sed -n 's|^neuronection-auth-kit @ git+https://github.com/neuronection/auth-kit@\([0-9a-f]*\)$|\1|p' backend/requirements.txt)"
          if [ -z "$rev" ]; then
            echo "::error::could not read the neuronection-auth-kit pin from backend/requirements.txt"
            exit 1
          fi
          git clone "$url" ../auth-kit || {
            echo "::error::neuronection/auth-kit not fetchable — make the repo public or add a read-only AUTH_KIT_TOKEN secret (fine-grained PAT, Contents: read on neuronection/auth-kit)"
            exit 1
          }
          git -C ../auth-kit checkout --detach "$rev"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt aiosqlite
          pip install --no-deps ../../auth-kit
      - name: Lint (ruff)
        run: |
          ruff check app tests careerassistant
          ruff format --check app tests careerassistant
      - name: Migrate test database
        run: python -m alembic upgrade head
      - name: Run tests
        run: python -m pytest tests/

  frontend:
    name: Frontend (lint + build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test (coverage floor)
        run: npm run test -- --run --coverage
      - name: Dependency audit (npm audit, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  packaging:
    name: Packaging (PyInstaller bundle + smoke)
    # 22.04 keeps the bundled libpython loadable on glibc 2.35 hosts —
    # mirrors the release job (see the comment there).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (pinned revision)
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AUTH_KIT_TOKEN: ${{ secrets.AUTH_KIT_TOKEN }}
        run: |
          if [ -d ../auth-kit ]; then exit 0; fi
          if [ -n "$AUTH_KIT_TOKEN" ]; then
            url="https://x-access-token:${AUTH_KIT_TOKEN}@github.com/neuronection/auth-kit.git"
          else
            url="https://github.com/neuronection/auth-kit.git"
          fi
          rev="$(sed -n 's|^neuronection-auth-kit @ git+https://github.com/neuronection/auth-kit@\([0-9a-f]*\)$|\1|p' backend/requirements.txt)"
          if [ -z "$rev" ]; then
            echo "::error::could not read the neuronection-auth-kit pin from backend/requirements.txt"
            exit 1
          fi
          git clone "$url" ../auth-kit || {
            echo "::error::neuronection/auth-kit not fetchable — make the repo public or add a read-only AUTH_KIT_TOKEN secret (fine-grained PAT, Contents: read on neuronection/auth-kit)"
            exit 1
          }
          git -C ../auth-kit checkout --detach "$rev"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config file xvfb
          # pygobject >= 3.58 builds against girepository-2.0 (Ubuntu 24.04+)
          if apt-cache show libgirepository-2.0-dev >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libgirepository-2.0-dev
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install backend build dependencies
        working-directory: backend
        run: |
          python -m venv venv
          ./venv/bin/pip install -r requirements.txt aiosqlite pywebview "pygobject>=3.50,<3.51" pyinstaller
          ./venv/bin/pip install --no-deps ../../auth-kit
      - name: Build bundle
        run: ./packaging/build-linux.sh bundle
      - name: Smoke test frozen bundle (headless web mode)
        run: |
          trap 'echo "=== smoke.log ==="; cat smoke.log; echo "=== bundle SPA dist ==="; ls -la backend/dist/careerassistant/_internal/frontend/dist/ || true' EXIT
          DATA_DIR="$PWD/packaging/_smoke" CAREER_SKIP_SEED=1 API_PORT=8199 \
            timeout 30 backend/dist/careerassistant/careerassistant web > smoke.log 2>&1 &
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8199/health > health.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [[ -z "$ok" ]]; then echo "server never became healthy" >&2; exit 1; fi
          grep '"status": *"ok"' health.json
          curl -fsS http://127.0.0.1:8199/ | grep -q 'id="root"'
          # Unknown /api/v1 routes must return a JSON error, never the SPA
          # shell. `web` mode arms the §11 shell-token gate, so an
          # unauthenticated curl is refused (403) before routing could 404.
          resp="$(curl -sS -o notfound.json -w '%{http_code} %{content_type}' \
            http://127.0.0.1:8199/api/v1/definitely-not-a-route)"
          [[ "$resp" =~ ^(403|404)\ application/json ]]
          grep -q '"detail"' notfound.json
      - name: Smoke test desktop launch under xvfb (frozen bundle)
        run: |
          set +e
          DATA_DIR="$PWD/packaging/_smoke-desktop" CAREER_SKIP_SEED=1 \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            timeout 30 xvfb-run -a \
            backend/dist/careerassistant/careerassistant \
            > desktop-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "desktop launch exited with $code (expected 124 = survived):" >&2
            cat desktop-smoke.log >&2
            exit 1
          fi
          echo "desktop launch survived 30s"

  docker:
    name: Docker (build image + validate compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (pinned revision)
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AUTH_KIT_TOKEN: ${{ secrets.AUTH_KIT_TOKEN }}
        run: |
          if [ -d ../auth-kit ]; then exit 0; fi
          if [ -n "$AUTH_KIT_TOKEN" ]; then
            url="https://x-access-token:${AUTH_KIT_TOKEN}@github.com/neuronection/auth-kit.git"
          else
            url="https://github.com/neuronection/auth-kit.git"
          fi
          rev="$(sed -n 's|^neuronection-auth-kit @ git+https://github.com/neuronection/auth-kit@\([0-9a-f]*\)$|\1|p' backend/requirements.txt)"
          if [ -z "$rev" ]; then
            echo "::error::could not read the neuronection-auth-kit pin from backend/requirements.txt"
            exit 1
          fi
          git clone "$url" ../auth-kit || {
            echo "::error::neuronection/auth-kit not fetchable — make the repo public or add a read-only AUTH_KIT_TOKEN secret (fine-grained PAT, Contents: read on neuronection/auth-kit)"
            exit 1
          }
          git -C ../auth-kit checkout --detach "$rev"
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: auth-kit=../auth-kit
          push: false
          load: true
          tags: career-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production compose file
        run: |
          cp docker/.env.production.example docker/.env
          docker compose -f docker/docker-compose.prod.yml config -q
      - name: Smoke test image (boot + /health)
        run: |
          docker network create smoke >/dev/null
          docker run -d --name pg --network smoke \
            -e POSTGRES_DB=neuronection_career -e POSTGRES_USER=neuronection_career_owner -e POSTGRES_PASSWORD=smoke \
            postgres:16-alpine >/dev/null
          # Fresh per-run keys: the boot guard (§8) refuses committed
          # dev/test fixtures, so smoke keys must be strong and distinct.
          SESSION_KEY="$(openssl rand -hex 32)"
          REFRESH_KEY="$(openssl rand -hex 32)"
          DATA_KEY="$(openssl rand -base64 32 | tr '+/' '-_')"
          docker run -d --name app --network smoke -p 8100:8100 \
            -e DATABASE_URL=postgresql+asyncpg://neuronection_career_owner:smoke@pg:5432/neuronection_career \
            -e CAREER_SESSION_KEY="$SESSION_KEY" \
            -e CAREER_REFRESH_KEY="$REFRESH_KEY" \
            -e CAREER_DATA_KEY="$DATA_KEY" \
            career-assistant:ci >/dev/null
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/health; then exit 0; fi
            sleep 2
          done
          echo "App did not become healthy" >&2
          docker logs app
          exit 1

  e2e:
    name: E2E (Playwright smoke over mock AI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neuronection_career_e2e
          POSTGRES_USER: neuronection_career_owner
          POSTGRES_PASSWORD: career_dev_pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neuronection_career_owner -d neuronection_career_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://neuronection_career_owner:career_dev_pw@127.0.0.1:5433/neuronection_career_e2e
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (pinned revision)
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AUTH_KIT_TOKEN: ${{ secrets.AUTH_KIT_TOKEN }}
        run: |
          if [ -d ../auth-kit ]; then exit 0; fi
          if [ -n "$AUTH_KIT_TOKEN" ]; then
            url="https://x-access-token:${AUTH_KIT_TOKEN}@github.com/neuronection/auth-kit.git"
          else
            url="https://github.com/neuronection/auth-kit.git"
          fi
          rev="$(sed -n 's|^neuronection-auth-kit @ git+https://github.com/neuronection/auth-kit@\([0-9a-f]*\)$|\1|p' backend/requirements.txt)"
          if [ -z "$rev" ]; then
            echo "::error::could not read the neuronection-auth-kit pin from backend/requirements.txt"
            exit 1
          fi
          git clone "$url" ../auth-kit || {
            echo "::error::neuronection/auth-kit not fetchable — make the repo public or add a read-only AUTH_KIT_TOKEN secret (fine-grained PAT, Contents: read on neuronection/auth-kit)"
            exit 1
          }
          git -C ../auth-kit checkout --detach "$rev"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps + Playwright
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt aiosqlite
          pip install --no-deps ../../auth-kit
          playwright install --with-deps chromium
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run E2E smoke
        run: bash scripts/run-e2e.sh
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/career-e2e-server.log
            test-results/
          if-no-files-found: ignore

  docs-sync:
    name: Docs sync (CHANGELOG gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: User-visible changes must update CHANGELOG.md
        run: |
          BASE="$(git merge-base HEAD "origin/${{ github.event.pull_request.base.ref }}")"
          scripts/check-changelog.sh "$BASE"
