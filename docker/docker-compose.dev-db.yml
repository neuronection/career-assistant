name: career

services:
  postgres:
    image: postgres:16-alpine
    container_name: career-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career}
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_dev_pw}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_TEST_DB:-career_test}
    volumes:
      - career_postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career} -d ${POSTGRES_DB:-career}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - career-net

  redis:
    image: redis:7-alpine
    container_name: career-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - career_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - career-net

volumes:
  career_postgres_data:
  career_redis_data:

networks:
  career-net:
    driver: bridge
