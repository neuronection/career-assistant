# Career Assistant — production stack (app + Postgres; proxy handled externally
# or via docker-compose.standalone.yml, which ships the family nginx flavor).
#
#   cp docker/.env.production.example docker/.env   # then edit secrets
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Registry images (built by the release workflow): set
# CAREER_IMAGE=ghcr.io/<owner>/<repo>:<tag> instead of building locally.

name: career-assistant

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # ADR-0022 (amended): the bootstrap role is `neuronection_career_owner`
      # — career keeps its single-role layout (this role runs migrations AND
      # serves runtime DML); there is no separate least-privilege `_app` role.
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_career}
      POSTGRES_USER: ${POSTGRES_USER:-neuronection_career_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuronection_career_owner} -d ${POSTGRES_DB:-neuronection_career}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Family auth-kit at the revision pinned in backend/requirements.txt —
      # see docker/Dockerfile. Resolved relative to this compose file.
      additional_contexts:
        auth-kit: ../../auth-kit
    image: ${CAREER_IMAGE:-career-assistant:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neuronection_career_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuronection_career}
      # Per-purpose key family (identity-auth §8) — generate each with:
      #   python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
      CAREER_SESSION_KEY: ${CAREER_SESSION_KEY:?Set CAREER_SESSION_KEY in docker/.env}
      CAREER_REFRESH_KEY: ${CAREER_REFRESH_KEY:?Set CAREER_REFRESH_KEY in docker/.env}
      CAREER_DATA_KEY: ${CAREER_DATA_KEY:?Set CAREER_DATA_KEY in docker/.env}
      # Both flavors are proxy-fronted by design (bundled nginx, or the
      # reverse proxy the app port is bound to) — trust one forwarded hop
      # so per-IP limits key on real clients.
      CAREER_TRUSTED_PROXY_COUNT: ${CAREER_TRUSTED_PROXY_COUNT:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # Same-origin SPA + API → CORS stays empty; add origins only for split
      # deployments (e.g. "https://app.example.com").
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      # Bound to localhost only — put a proxy in front for public traffic
      # (docker-compose.standalone.yml ships the family nginx flavor).
      - "127.0.0.1:${API_PORT:-8100}:8100"
    volumes:
      - uploads_data:/app/uploads

  backup:
    # Scheduled instance backups (database dump + uploads) written to the
    # ./backups bind mount. Enable with --profile backup.
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_career}
      POSTGRES_USER: ${POSTGRES_USER:-neuronection_career_owner}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
    command: >
      sh -c 'while true; do
        ts=$$(date -u +%Y%m%d-%H%M%S);
        pg_dump -U $$POSTGRES_USER -Fc $$POSTGRES_DB > /backups/db-$$ts.dump;
        find /backups -name "db-*.dump" | sort | head -n -$$BACKUP_KEEP | xargs -r rm --;
        sleep $$((BACKUP_INTERVAL_HOURS * 3600));
      done'

volumes:
  db_data:
  uploads_data: