name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  ci-gate:
    # Same-SHA CI gate: the release may only publish for a commit whose CI
    # run passed. Release-day CI (backend pytest on Postgres + the ~30 min
    # SQLite desktop-profile suite + frontend + packaging) regularly runs
    # close to half an hour, so this waits on a 50-minute deadline under a
    # 60-minute job timeout — a slow run must never fail the release
    # spuriously (the old fixed 30×30s loop expired exactly at the CI
    # finish line and turned slow-but-green CI into a failed release).
    name: CI gate (same SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          deadline=$(( $(date +%s) + 50 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1")"
            status="$(jq -r '.workflow_runs[0].status // ""' <<<"$run")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$run")"
            if [ "$conclusion" = "success" ]; then
              echo "CI passed for $SHA"
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "CI concluded '$conclusion' for $SHA — refusing to publish" >&2
              exit 1
            fi
            echo "waiting for CI on $SHA (status: ${status:-not started})"
            sleep 30
          done
          echo "no completed CI run for $SHA within 50 minutes — push main and let CI finish first" >&2
          exit 1

  linux:
    name: Linux packages (deb + AppImage)
    needs: ci-gate
    # 22.04, not ubuntu-latest: the bundled libpython3.12 must load on
    # machines still on glibc 2.35 (Ubuntu 22.04 / Debian 12) — pinned
    # by the same reason study-assistant pins its packaging job 22.04
    # (the 2.38+ requirement shows up only on end-user machines).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4


      - name: Verify tag matches app version
        run: |
          VERSION="$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('backend/app/__init__.py').read()).group(1))")"
          if [[ "refs/tags/v$VERSION" != "$GITHUB_REF" ]]; then
            echo "Tag $GITHUB_REF does not match app version v$VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # gdk-pixbuf tools package name differs across releases:
          # Ubuntu <= 24.04 / Debian <= 12 ship libgdk-pixbuf2.0-bin,
          # Debian 13+ / newer Ubuntu ship libgdk-pixbuf-2.0-bin.
          if apt-cache show libgdk-pixbuf2.0-bin >/dev/null 2>&1; then
            PIXBUF_BIN=libgdk-pixbuf2.0-bin
          else
            PIXBUF_BIN=libgdk-pixbuf-2.0-bin
          fi
          # pygobject >= 3.58 builds against the new girepository-2.0 API
          # (Ubuntu 24.04+ / Debian 13+); older images only ship the 1.0 dev
          # package, where pygobject < 3.58 still builds.
          GI2_DEV=""
          if apt-cache show libgirepository-2.0-dev >/dev/null 2>&1; then
            GI2_DEV=libgirepository-2.0-dev
          fi
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config file xvfb \
            libnss3 libnspr4 libasound2 libgbm1 libxkbcommon0 \
            "$PIXBUF_BIN" "$GI2_DEV"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend build dependencies
        run: uv sync --frozen --extra desktop --extra pdf --extra sqlite

      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Build packages (deb + AppImage)
        run: ./packaging/build-linux.sh all "$VERSION"

      - name: Smoke test frozen bundle (headless web mode)
        run: |
          CAREER_DATA_DIR="$PWD/packaging/_smoke" CAREER_SKIP_SEED=1 CAREER_API_PORT=8199 \
            timeout 30 backend/dist/careerassistant/careerassistant web > smoke.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8199/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8199/health | grep '"status": *"ok"'
          curl -fsS http://127.0.0.1:8199/ | grep -q "<div id=\"root\">"
          # Unknown /api/v1 routes must return a JSON error, never the SPA
          # shell. `web` mode arms the §11 shell-token gate, so an
          # unauthenticated curl is refused (403) before routing could 404.
          resp="$(curl -sS -o notfound.json -w '%{http_code} %{content_type}' \
            http://127.0.0.1:8199/api/v1/definitely-not-a-route)"
          [[ "$resp" =~ ^(403|404)\ application/json ]]
          grep -q '"detail"' notfound.json

      - name: Smoke test desktop launch under xvfb (stripped deb stage)
        run: |
          set +e
          CAREER_DATA_DIR="$PWD/packaging/_smoke-desktop" CAREER_SKIP_SEED=1 \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            timeout 30 xvfb-run -a \
            packaging/_deb/usr/lib/careerassistant/careerassistant \
            > desktop-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "desktop launch exited with $code (expected 124 = survived):" >&2
            cat desktop-smoke.log >&2
            exit 1
          fi
          echo "desktop launch survived 30s"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packaging/*.deb
            packaging/*.AppImage

      - name: Create stable-name download aliases
        working-directory: packaging
        run: |
          cp CareerAssistant-*-x86_64.AppImage CareerAssistant-x86_64.AppImage
          cp careerassistant_*_amd64.deb careerassistant_amd64.deb

      # Never latest from here — the latest-alias race (plan 69 §8, audit
      # §4a-3): whichever asset job lands first must not mark the release
      # latest, or `releases/latest/download/career-bootstrap.sh` can 404
      # while sibling jobs are still uploading. The final publish-release
      # job flips the alias once every asset job has succeeded.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/*.deb
            packaging/*.AppImage
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false

  windows:
    name: Windows executable (PyInstaller onefile)
    needs: ci-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4


      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('backend/app/__init__.py').read()).group(1))")"
          if [[ "refs/tags/v$VERSION" != "$GITHUB_REF" ]]; then
            echo "Tag $GITHUB_REF does not match app version v$VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend build dependencies
        run: uv sync --frozen --extra desktop --extra pdf --extra sqlite

      - name: Build PyInstaller onefile exe
        env:
          CA_ONEFILE: "1"
        run: uv run pyinstaller --clean --noconfirm --distpath backend/dist packaging/career-assistant.spec

      - name: Smoke test frozen PDF engine (system Edge channel)
        shell: pwsh
        # plan 94: the smoke has never passed on hosted Windows (the exe
        # dies at boot with no output — likely Defender flagging the fresh
        # onefile build). Diagnose, report, and do not gate the release on
        # it until root-caused; the desktop app degrades to no-engine 503s
        # by design when the engine cannot run.
        continue-on-error: true
        run: |
          Get-ChildItem "backend\dist" | Format-Table Name, Length
          $dist = (Resolve-Path "backend\dist").Path
          Add-MpPreference -ExclusionPath $dist -ErrorAction SilentlyContinue
          & "backend\dist\CareerAssistant.exe" enginecheck
          $code = $LASTEXITCODE
          Write-Host "enginecheck exit code: $code"
          if ($code -ne 0) { Write-Host "::warning::frozen enginecheck failed (exit $code)" }

      - name: Smoke test frozen bundle (headless web mode)
        env:
          CAREER_DATA_DIR: ${{ runner.temp }}\ca-data
        shell: pwsh
        run: |
          $env:CAREER_SKIP_SEED = "1"
          $env:CAREER_API_PORT = "8199"
          $p = Start-Process -FilePath "backend/dist/CareerAssistant.exe" -ArgumentList "web" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8199/health" -TimeoutSec 2
              if ($health.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          taskkill /PID $p.Id /T /F 2>$null
          if (-not $ok) { throw "health check timed out" }

      - name: Rename artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item "backend/dist/CareerAssistant.exe" "packaging/CareerAssistant-$env:VERSION-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: packaging/CareerAssistant-*-windows-x64.exe
          if-no-files-found: error

      - name: Create stable-name download alias
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packaging
        shell: pwsh
        run: Copy-Item "CareerAssistant-*-windows-x64.exe" "CareerAssistant-windows-x64.exe"

      # Never latest from here (latest-alias race) — publish-release flips
      # the alias only after every asset job has succeeded.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/CareerAssistant-*-windows-x64.exe
            packaging/CareerAssistant-windows-x64.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false

  docker:
    name: Docker image (GHCR)
    needs: ci-gate
    runs-on: ubuntu-latest
    # Expose the pushed image digest for the deploy-bundle job (and the
    # release manifest): steps.build.outputs.digest = sha256:…
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-bundle:
    # Source-free compose/nginx/backup bundle for single-host operators,
    # pinned to the exact GHCR digest built above (ADR-0065 artifact shape:
    # career-compose-v<version>.tar.gz + manifest.json + SHA256SUMS).
    # Attaches to the same GitHub release as the desktop assets; whichever
    # asset job lands first creates the release, so none of them may take
    # the `latest` alias (the one-liner's
    # releases/latest/download/career-bootstrap.sh must never resolve to a
    # release whose sibling assets are still uploading). publish-release
    # flips the alias after linux + windows + this job have all succeeded.
    name: Deploy bundle (compose)
    needs: [ci-gate, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment bundle
        run: |
          repo="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          scripts/build-deploy-bundle.sh \
            --version "${GITHUB_REF_NAME}" \
            --image "ghcr.io/${repo}@${{ needs.docker.outputs.digest }}" \
            --out-dir dist
      # Attach the one-line bootstrap when it exists. scripts/bootstrap.sh
      # is GENERATED from the family installer contract's template — never
      # hand-written or invented here. Until the sync generates it, this
      # step is a deliberate no-op and the release simply has no bootstrap
      # asset yet; the bundle + manifest are still complete.
      - name: Stage bootstrap assets (when generated)
        run: |
          if [ -f scripts/bootstrap.sh ]; then
            cp scripts/bootstrap.sh "dist/career-bootstrap-${GITHUB_REF_NAME}.sh"
            cp scripts/bootstrap.sh dist/career-bootstrap.sh
            (
              cd dist
              sha256sum "career-bootstrap-${GITHUB_REF_NAME}.sh" career-bootstrap.sh >> SHA256SUMS
            )
          else
            echo "scripts/bootstrap.sh not generated yet — skipping bootstrap assets."
          fi
      - name: Verify bundle checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/career-compose-*.tar.gz
            dist/manifest.json
            dist/SHA256SUMS
            dist/career-bootstrap-v*.sh
            dist/career-bootstrap.sh
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false

  publish-release:
    # Latest-alias gate (plan 69 §8 / audit §4a-3): the linux, windows and
    # deploy-bundle jobs all create/update the release with make_latest:false,
    # so `releases/latest/download/career-bootstrap.sh` cannot resolve to a
    # release whose assets are still uploading. Only when EVERY asset job
    # has succeeded does this job move the `latest` alias to this release —
    # the last thing the release workflow does.
    name: Publish release (latest alias)
    needs: [linux, windows, deploy-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Mark the release latest (stable tags only, after all assets exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Defense in depth: needs: proves the asset jobs are green, but a
          # green job can still have attached nothing (the bootstrap staging
          # step is a deliberate no-op while scripts/bootstrap.sh is not
          # generated). Refuse to point the one-liner at a release that is
          # missing any contract asset.
          missing=""
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for want in "career-compose-${TAG}.tar.gz" manifest.json SHA256SUMS \
                      "career-bootstrap-${TAG}.sh" career-bootstrap.sh; do
            grep -qx "$want" <<<"$have" || missing="${missing:+$missing }$want"
          done
          if [ -n "$missing" ]; then
            echo "::error::release $TAG is missing assets: $missing — refusing to take the latest alias (the one-liner would 404)."
            exit 1
          fi
          # The release is published (never a draft — the asset jobs create
          # it with softprops' default draft:false), so no --draft=false is
          # needed here; add it only if release creation ever turns drafty.
          # Prerelease tags (dashes — the same expression as prerelease:)
          # keep the alias on the last stable release, exactly as before
          # this job existed.
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease $TAG — leaving the latest alias on the last stable release."
            exit 0
          fi
          gh release edit "$TAG" --latest
          echo "release $TAG now holds the latest alias — every asset is attached."
