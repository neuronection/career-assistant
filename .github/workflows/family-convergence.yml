name: Family convergence

# Family-convergence gate (plan 20 D9 / reference-architecture.md) — tool
# config parity, prefixed-only env, migrations home, no legacy markers,
# packaging shape, contract gates. Script must stay byte-identical across
# family repos (sha-checked by the family wiring verifier).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'scripts/**'
      - 'docker/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/check-family-convergence.sh'
      - '.github/workflows/family-convergence.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'scripts/**'
      - 'docker/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/check-family-convergence.sh'
      - '.github/workflows/family-convergence.yml'
  workflow_dispatch:

jobs:
  converge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Gate self-test (plan 23 D4)
        run: bash scripts/check-family-convergence.selftest.sh
      - name: Extension structure probe (blocking, plan 32 Phase 9)
        run: bash scripts/check-extensions-structure.sh --strict
      - name: Run family-convergence gate
        run: bash scripts/check-family-convergence.sh --self

  extension-conformance:
    name: Extension conformance wall (ADR-0040)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CAREER_APP_ENV: test
      CAREER_DATABASE_URL: sqlite+aiosqlite:///./neuronection_career_test.db
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      CAREER_MOCK_AI: "1"
      CAREER_RATELIMIT_AI: "0"
      CAREER_RATELIMIT_ENABLED: "false"
      CAREER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Migrate the test database
        working-directory: backend
        run: uv run --frozen alembic upgrade head
      - name: Run the vendored contract fixtures + semantics
        working-directory: backend
        run: uv run --frozen pytest tests/test_extensions_contract.py -q
