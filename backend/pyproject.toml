[project]
name = "careerassistant"
description = "AI-powered career coaching platform — web and desktop"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18",
    # Family auth kit — resolved by [tool.uv.sources] at the workspace
    # root to the pinned git SHA (never PyPI while the org is pending —
    # and a bare name there would be squat-able). Phase 0.8 (PyPI)
    # switches it to the published `neuronection-auth-kit==X.Y.Z`.
    "neuronection-auth-kit",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.49",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "email-validator>=2.3",
    "pyjwt>=2.13",
    "bcrypt>=4.3",
    "cryptography>=50",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "pywebpush>=2.0",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langchain-google-genai>=4.3,<5",
    # Plan 52 T1-min: exact token counting for the curated embedding models.
    # The encodings ship as data under app/data/tokenizers — never fetched.
    "tiktoken>=0.14,<0.15",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-sqlite>=3,<4",
    "typesafe-sdk>=0.7,<0.8",
    "pypdf>=6.21.4,<7",
    "psycopg[binary,pool]>=3.3",
    "pypdfium2>=5.13",
    "python-docx>=1.2",
    "pillow>=12",
    "fastmcp>=4.0",
    "qrcode>=8.2",
    "tokenizers>=0.22,<1",
]
dynamic = ["version"]

[project.optional-dependencies]
# Server-side PDF engine for CV exports (plan 76): also needs
# `playwright install chromium --only-shell`. Without it, PDF export
# degrades to the print-ready HTML view.
pdf = ["playwright>=1.62"]
# SQLite profile (desktop/dev databases and the SQLite CI lane).
sqlite = ["aiosqlite>=0.20", "sqlite-vec>=0.1.9,<0.2"]
# Desktop profile (python -m careerassistant). Linux system packages:
# libgtk-3, libwebkit2gtk-4.1 (docs/deploy.md).
desktop = [
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1.9,<0.2",
    "pywebview>=5.3",
    "pystray>=0.19",
    "pygobject>=3.50,<3.51 ; sys_platform == 'linux'",
]
# Optional OTel span export (plan 168, ADR-0044 addendum): opt-in via
# CAREER_OTEL_EXPORT; without the extra every span is a no-op, so the
# desktop bundle never needs it and the PyInstaller spec includes nothing.
otel = [
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[project.scripts]
careerassistant = "app.shell:run"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pyinstaller>=6.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "pytest-cov>=5.0",
    "pytest-dotenv>=0.5",
    "pytest-playwright>=0.5",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "careerassistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored family contract modules must stay BYTE-identical to their dev
# canonicals (ADR-0031/0035/0040) — excluded from the formatter too, since
# `ruff format` does not honor the lint per-file-ignores below and would
# reflow them (plan 81 C review, 2026-10-21).
extend-exclude = [
    "app/extensions/contract.py",
    "app/extensions/polite_http.py",
    "app/extensions/conformance.py",
    "app/extensions/search/providers_contract.py",
    "app/extensions/isolation.py",
    "app/ai/flow_events.py",
    "app/storage/retrieval_ops.py",
    "app/storage/vector_contract.py",
    "app/storage/tokenizer_contract.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/sync-ai-presets.mjs from the dev canonical
# contracts/ai-presets.json — never hand-edited; long decision-model data
# lines are exempt (the byok gate's R1 guards the data, not ruff).
"app/ai/providers/presets_data.py" = ["E501"]
# Vendored family extension-contract modules (family canonical via
# scripts/sync-extension-contract.sh, byte-identical, never edited here —
# ADR-0031/ADR-0040): lint findings belong in the dev canonical, not the
# vendored copy; drift is gated by the sync ledger + verify-wiring.
"app/extensions/polite_http.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
"app/extensions/contract.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
"app/extensions/conformance.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# Vendored family vector contract (family canonical via
# scripts/sync-vector-contract.sh, byte-identical, never edited here —
# ADR-0031/ADR-0051): lint findings belong in the dev canonical.
"app/storage/vector_contract.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# Vendored family retrieval-operations contract (family canonical via
# scripts/sync-retrieval-ops.sh, byte-identical, never edited here —
# ADR-0031/ADR-0051): lint findings belong in the dev canonical.
"app/storage/retrieval_ops.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# Vendored family tokenizer contract (family canonical via
# scripts/sync-tokenizer-contract.sh, byte-identical, never edited here —
# ADR-0031/ADR-0051): lint findings belong in the dev canonical.
"app/storage/tokenizer_contract.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
# The generated presets module (sync-ai-presets.mjs from the dev canonical)
# is not formatter-stable — its long decision-model dict lines are emitted
# deliberately and lint-ignored above (plan 26 Phase 6: the family-wide
# accommodation; the byok gate's R1 guards the data, not ruff).
# The vendored extension-contract modules are likewise byte-identical
# canonicals — formatting them here would break the sync ledger.
exclude = [
  "app/ai/providers/presets_data.py",
  "app/extensions/polite_http.py",
  "app/extensions/contract.py",
  "app/extensions/conformance.py",
  "app/storage/retrieval_ops.py",
  "app/storage/vector_contract.py",
]

[tool.mypy]
# The type gate grows by ratchet: packages join `files` only when clean,
# and never leave. Packages still being cleaned are pinned in
# [tool.career-mypy-ratchet] below (plan 124.2) and enforced by
# scripts/check-mypy-ratchet.py, which fails when a package's error count
# moves in EITHER direction.
#
# The vendored extension-contract canonical (app/extensions/contract.py)
# is byte-identical to the family extension contract — never edited in-repo,
# and mypy-strict compliance is the dev canonical's duty (the
# unification wave's sync introduced strict-mode findings here; study
# carries the same exclusion).
files = [
    "app/ai",
    "app/api",
    "app/auth",
    "app/backups.py",
    "app/core",
    "app/desktop",
    "app/extensions",
    "app/local.py",
    "app/main.py",
    "app/middleware.py",
    "app/models",
    "app/schemas",
    "app/seeds",
    "app/services",
    "app/shell.py",
    "app/storage",
]
exclude = [
    "app/extensions/contract.py",
    "app/storage/retrieval_ops.py",
    "app/storage/vector_contract.py",
    "app/storage/tokenizer_contract.py",
]
ignore_missing_imports = true
follow_imports = "silent"

[tool.career-mypy-ratchet]
# Pinned mypy error counts for packages that are not clean yet
# (plan 124: the wall is the number; it may only ratchet DOWN). Fixing
# errors requires lowering the peg in the same commit
# (`uv run python ../scripts/check-mypy-ratchet.py --update`); adding any
# error fails CI. Clean packages move to `[tool.mypy] files` instead.
# The wall is empty: app/services joined `files` clean (209 -> 0).
packages = {}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env_files = [".env.test", ".env"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Watchdog: a hung test fails with a stack dump instead of freezing the
# whole session.
timeout = 120
timeout_method = "signal"
markers = [
    # identity-auth §18 contract cases — the drift gate against the family
    # test kit (CI runs `pytest -m contract` as an explicit step).
    "contract: implements an identity-auth §18 contract case (family drift gate)",
    # Plan 120: p95 Explore budgets on synthetic 1k/10k fixtures.
    # On-demand only — never a PR gate (CAREER_PERF_BENCH=1).
    "benchmark: on-demand performance benchmark (skipped unless CAREER_PERF_BENCH=1)",
]
