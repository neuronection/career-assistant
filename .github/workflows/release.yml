name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  linux:
    name: Linux packages (deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        run: |
          VERSION="$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('backend/app/__init__.py').read()).group(1))")"
          if [[ "refs/tags/v$VERSION" != "$GITHUB_REF" ]]; then
            echo "Tag $GITHUB_REF does not match app version v$VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # gdk-pixbuf tools package name differs across releases:
          # Ubuntu <= 24.04 / Debian <= 12 ship libgdk-pixbuf2.0-bin,
          # Debian 13+ / newer Ubuntu ship libgdk-pixbuf-2.0-bin.
          if apt-cache show libgdk-pixbuf2.0-bin >/dev/null 2>&1; then
            PIXBUF_BIN=libgdk-pixbuf2.0-bin
          else
            PIXBUF_BIN=libgdk-pixbuf-2.0-bin
          fi
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config file xvfb "$PIXBUF_BIN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend build dependencies
        working-directory: backend
        run: |
          python -m venv venv
          ./venv/bin/pip install -r requirements.txt aiosqlite pywebview pygobject pyinstaller

      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Build packages (deb + AppImage)
        run: ./packaging/build-linux.sh all "$VERSION"

      - name: Smoke test frozen bundle (headless web mode)
        run: |
          DATA_DIR="$PWD/packaging/_smoke" CAREER_SKIP_SEED=1 API_PORT=8199 \
            timeout 30 backend/dist/careerassistant/careerassistant web > smoke.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8199/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8199/health | grep '"status": *"ok"'
          curl -fsS http://127.0.0.1:8199/ | grep -q "<div id=\"root\">"
          # Unknown /api/v1 routes must be JSON 404s, not SPA fallbacks.
          # No curl -f here: the 404 is the expected outcome.
          resp="$(curl -sS -o notfound.json -w '%{http_code} %{content_type}' \
            http://127.0.0.1:8199/api/v1/definitely-not-a-route)"
          [[ "$resp" == "404 application/json"* ]]
          grep -q "Not Found" notfound.json

      - name: Smoke test desktop launch under xvfb (stripped deb stage)
        run: |
          set +e
          DATA_DIR="$PWD/packaging/_smoke-desktop" CAREER_SKIP_SEED=1 \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            timeout 30 xvfb-run -a \
            packaging/_deb/usr/lib/careerassistant/careerassistant \
            > desktop-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "desktop launch exited with $code (expected 124 = survived):" >&2
            cat desktop-smoke.log >&2
            exit 1
          fi
          echo "desktop launch survived 30s"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packaging/*.deb
            packaging/*.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/*.deb
            packaging/*.AppImage
          generate_release_notes: true

  windows:
    name: Windows executable (PyInstaller onefile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('backend/app/__init__.py').read()).group(1))")"
          if [[ "refs/tags/v$VERSION" != "$GITHUB_REF" ]]; then
            echo "Tag $GITHUB_REF does not match app version v$VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend build dependencies
        working-directory: backend
        run: |
          python -m venv venv
          ./venv/Scripts/pip install -r requirements.txt aiosqlite pywebview pyinstaller

      - name: Build PyInstaller onefile exe
        env:
          CA_ONEFILE: "1"
        run: backend/venv/Scripts/pyinstaller --clean --noconfirm --distpath backend/dist packaging/career-assistant.spec

      - name: Smoke test frozen bundle (headless web mode)
        env:
          DATA_DIR: ${{ runner.temp }}\ca-data
        shell: pwsh
        run: |
          $env:CAREER_SKIP_SEED = "1"
          $env:API_PORT = "8199"
          $p = Start-Process -FilePath "backend/dist/CareerAssistant.exe" -ArgumentList "web" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8199/health" -TimeoutSec 2
              if ($health.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          taskkill /PID $p.Id /T /F 2>$null
          if (-not $ok) { throw "health check timed out" }

      - name: Rename artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item "backend/dist/CareerAssistant.exe" "packaging/CareerAssistant-$env:VERSION-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: packaging/CareerAssistant-*-windows-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/CareerAssistant-*-windows-x64.exe

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
