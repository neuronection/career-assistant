# Career Assistant — Docker Nginx Configuration (Standalone Flavor)
#
# ⚠️ HTTP-ONLY — for local dev / VPN / loopback use.
#
# Internet-facing deployments MUST serve over TLS: copy
# nginx-TLS.conf over this file (or point the compose volume at it) and
# mount certificates (see docker/README.md → TLS). User profiles and
# bearer tokens must never cross the network in cleartext.
#
# The app image is same-origin: uvicorn serves both the API (/api/v1)
# and the built SPA (/) from one process on :8100, so every location
# proxies to the same upstream.

server {
    listen 80;
    server_name _; # Catch-all, or replace with your domain

    # Keep in sync with MAX_UPLOAD_MB (PDF intake uploads).
    client_max_body_size 64m;

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Backend API (FastAPI)
    location /api/ {
        proxy_pass http://app:8100;

        # Extended timeouts for long-running requests (AI generation).
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;

        # Support for streaming responses (SSE) and future WebSockets;
        # flush immediately, never buffer.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # 2. Backend health check (docs are disabled in prod builds).
    location = /health {
        proxy_pass http://app:8100;
    }

    # 3. Frontend (React SPA build served by the backend).
    # This must be the last block to act as a catch-all for React Router routes.
    location / {
        proxy_pass http://app:8100;
    }
}
