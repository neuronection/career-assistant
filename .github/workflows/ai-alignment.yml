name: AI architecture alignment

# AI-architecture alignment gate — shared Neuronection rule set
# (must stay byte-identical across family repos).
# MODE: strict (career migrated to the LangChain gateway — phase 1).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/check-ai-alignment.sh'
      - '.github/workflows/ai-alignment.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/check-ai-alignment.sh'
      - '.github/workflows/ai-alignment.yml'
  workflow_dispatch:

jobs:
  align:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run AI alignment gate
        run: bash scripts/check-ai-alignment.sh --self --mode strict
