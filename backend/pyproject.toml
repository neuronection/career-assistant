[project]
name = "careerassistant"
description = "AI-powered career coaching platform — web and desktop"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18",
    # Family auth kit — resolved by [tool.uv.sources] at the workspace
    # root to the pinned git SHA (never PyPI while the org is pending —
    # and a bare name there would be squat-able). Phase 0.8 (PyPI)
    # switches it to the published `neuronection-auth-kit==X.Y.Z`.
    "neuronection-auth-kit",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.49",
    "sqlalchemy>=2.0",
    "asyncpg>=0.31",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "email-validator>=2.3",
    "pyjwt>=2.13",
    "bcrypt>=4.3",
    "cryptography>=50",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "pywebpush>=2.0",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langchain-google-genai>=4.3,<5",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pypdf>=6.18",
    "psycopg[binary,pool]>=3.3",
    "pypdfium2>=5.13",
    "python-docx>=1.2",
    "pillow>=12",
    "fastmcp>=4.0",
    "qrcode>=8.2",
]
dynamic = ["version"]

[project.optional-dependencies]
# Server-side PDF engine for CV exports (plan 76): also needs
# `playwright install chromium --only-shell`. Without it, PDF export
# degrades to the print-ready HTML view.
pdf = ["playwright>=1.62"]
# SQLite profile (desktop/dev databases and the SQLite CI lane).
sqlite = ["aiosqlite>=0.20"]
# Desktop profile (python -m careerassistant). Linux system packages:
# libgtk-3, libwebkit2gtk-4.1 (docs/deploy.md).
desktop = [
    "aiosqlite>=0.20",
    "pywebview>=5.3",
    "pystray>=0.19",
    "pygobject>=3.50,<3.51 ; sys_platform == 'linux'",
]

[project.scripts]
careerassistant = "app.shell:run"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pyinstaller>=6.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "pytest-cov>=5.0",
    "pytest-dotenv>=0.5",
    "pytest-playwright>=0.5",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "careerassistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
# The type gate grows by ratchet: packages join `files` only when clean,
# and never leave. app/services is the next candidate (110 errors at
# adoption, 2026-09-09); fix in sub-slices, then add it.
files = ["app/ai", "app/schemas", "app/models"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env_files = [".env.test", ".env"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Watchdog: a hung test fails with a stack dump instead of freezing the
# whole session.
timeout = 120
timeout_method = "signal"
markers = [
    # identity-auth §18 contract cases — the drift gate against the family
    # test kit (CI runs `pytest -m contract` as an explicit step).
    "contract: implements an identity-auth §18 contract case (family drift gate)",
]
