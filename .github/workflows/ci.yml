name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest) — shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: neuronection_career_test
          POSTGRES_USER: neuronection_career_owner
          POSTGRES_PASSWORD: career_dev_pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neuronection_career_owner -d neuronection_career_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CAREER_APP_ENV: test
      CAREER_DATABASE_URL: postgresql+asyncpg://neuronection_career_owner:career_dev_pw@127.0.0.1:5433/neuronection_career_test
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      # Mirrors backend/.env.test.example: the suite's mock-dependent tests
      # resolve the deterministic mock provider only when this knob is on.
      CAREER_MOCK_AI: "1"
      CAREER_RATELIMIT_AI: "0"
      CAREER_RATELIMIT_ENABLED: "false"
      CAREER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Enable pgvector
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              url = os.environ["CAREER_DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://"
              )
              conn = await asyncpg.connect(url)
              try:
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              finally:
                  await conn.close()


          asyncio.run(main())
          PY
      # Shards are assigned by measured file duration (plan 227), never by
      # count. The manifest is exactly what pytest collects, so the shards
      # cover the tree; `--check` proves every file is assigned once.
      - name: Collect the test-file manifest
        run: |
          set -o pipefail
          uv run pytest tests --collect-only -q -o addopts="" \
            | grep '::' | cut -d: -f1 | sort -u > /tmp/files.txt
          test -s /tmp/files.txt
      - name: Select shard ${{ matrix.shard }}/2
        run: >
          python3 ../scripts/check-test-shards.py
          --files /tmp/files.txt --of 2 --shard ${{ matrix.shard }}
          --out /tmp/shard.txt
      - name: Verify the partition (global, once)
        if: matrix.shard == 1
        run: python3 ../scripts/check-test-shards.py --check --files /tmp/files.txt --of 2
      - name: Run tests (shard ${{ matrix.shard }}/2, xdist-parallel)
        run: >
          uv run pytest $(cat /tmp/shard.txt)
          -n auto --dist loadfile
          --cov=app --cov-append --cov-report=
          --junitxml=junit-shard-${{ matrix.shard }}.xml
      - name: Keep the shard coverage database
        if: always()
        run: |
          if [[ -f .coverage ]]; then cp .coverage .coverage.shard-${{ matrix.shard }}; fi
      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-coverage-${{ matrix.shard }}
          path: backend/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload shard JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-junit-${{ matrix.shard }}
          path: backend/junit-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore

  backend-gate:
    name: Backend (ruff + pytest)
    needs: [backend, backend-checks]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Require the shards and the static checks
        # `if: always()` keeps this job reachable for diagnostics, but the
        # protected context must FAIL when a shard or a static check failed —
        # otherwise moving mypy/contract out of this job would silently drop
        # them from the required check.
        if: always()
        # The job default is `backend/`, which checkout has not created yet:
        # without this override GitHub cannot even start the process.
        working-directory: .
        env:
          SHARDS: ${{ needs.backend.result }}
          CHECKS: ${{ needs.backend-checks.result }}
        run: |
          for result in "$SHARDS" "$CHECKS"; do
            if [[ "$result" != "success" ]]; then
              echo "a required upstream job did not succeed: $result" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Download shard coverage
        uses: actions/download-artifact@v7
        with:
          pattern: postgres-coverage-*
          path: backend
          merge-multiple: true
      - name: Combine shard coverage
        # Explicit inputs: a missing shard artifact is an error, not a pass.
        run: uv run coverage combine .coverage.shard-1 .coverage.shard-2
      - name: Coverage floor (whole suite, both shards)
        run: uv run coverage report --fail-under=79 --skip-covered

  backend-checks:
    name: Backend checks (static + contract)
    # Plan 227 T1 follow-up: the static gates read the tree, not the shard
    # artifacts, so they belong in their own job alongside the matrix instead
    # of serialised behind it in the required gate. The gate depends on this
    # job, so a red check still blocks `main`.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: neuronection_career_test
          POSTGRES_USER: neuronection_career_owner
          POSTGRES_PASSWORD: career_dev_pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neuronection_career_owner -d neuronection_career_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CAREER_APP_ENV: test
      CAREER_DATABASE_URL: postgresql+asyncpg://neuronection_career_owner:career_dev_pw@127.0.0.1:5433/neuronection_career_test
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      CAREER_MOCK_AI: "1"
      CAREER_RATELIMIT_AI: "0"
      CAREER_RATELIMIT_ENABLED: "false"
      CAREER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Enable pgvector
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              url = os.environ["CAREER_DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://"
              )
              conn = await asyncpg.connect(url)
              try:
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              finally:
                  await conn.close()


          asyncio.run(main())
          PY
      - name: Tracing suite with the otel extra installed (plan 168)
        run: uv run --extra otel pytest tests/test_tracing.py
      - name: Contract drift gate (identity-auth §18)
        run: uv run pytest -m contract
      - name: OpenAPI contract diff
        run: uv run python ../scripts/check-openapi.py --check
      - name: Type check (mypy)
        run: uv run mypy
      - name: Type ratchet (app/services wall)
        run: uv run python ../scripts/check-mypy-ratchet.py
      - name: Dependency audit (pip-audit, blocking with reviewed allowlist)
        run: uv run --with pip-audit python ../scripts/check-dependency-audit.py --ecosystem pip

  backend-sqlite:
    name: Backend on SQLite (desktop profile) — shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend
    env:
      CAREER_APP_ENV: test
      CAREER_DATABASE_URL: sqlite+aiosqlite:///./neuronection_career_test.db
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      CAREER_MOCK_AI: "1"
      CAREER_RATELIMIT_AI: "0"
      CAREER_RATELIMIT_ENABLED: "false"
      CAREER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrate test database
        run: uv run alembic upgrade head
      # Plan 227: the SQLite lane is sharded by measured file duration. Each
      # shard runs the parallel-safe lane over its own files; the serial lane
      # (not parallel-safe on the desktop profile) runs once in the gate job.
      - name: Collect the test-file manifest
        run: |
          set -o pipefail
          uv run pytest tests --collect-only -q -o addopts="" \
            | grep '::' | cut -d: -f1 | sort -u > /tmp/files.txt
          test -s /tmp/files.txt
      - name: Select shard ${{ matrix.shard }}/2
        run: >
          python3 ../scripts/check-test-shards.py
          --files /tmp/files.txt --of 2 --shard ${{ matrix.shard }}
          --out /tmp/shard.txt
      - name: Verify the partition (global, once)
        if: matrix.shard == 1
        run: python3 ../scripts/check-test-shards.py --check --files /tmp/files.txt --of 2
      - name: Run tests — parallel-safe lane (shard ${{ matrix.shard }}/2)
        # `-n 4` is pinned (plan 226 §13): four workers on a GitHub-hosted
        # `ubuntu-latest` deliver ~1.35x over the serial lane; oversubscribing
        # makes it worse. Sharding divides the work across runners instead.
        run: >
          uv run pytest $(cat /tmp/shard.txt)
          -m "not serial" -n 4 --dist loadfile
          --cov=app --cov-append --cov-report=
          --junitxml=junit-shard-${{ matrix.shard }}.xml
      - name: Keep the shard coverage database
        if: always()
        run: |
          if [[ -f .coverage ]]; then cp .coverage .coverage.shard-${{ matrix.shard }}; fi
      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-coverage-${{ matrix.shard }}
          path: backend/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload shard JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-junit-${{ matrix.shard }}
          path: backend/junit-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore
      - name: Upload shard skip observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-observations-${{ matrix.shard }}
          path: backend/tests/_xdist/skip_observations.json
          if-no-files-found: ignore

  backend-sqlite-checks:
    name: Backend on SQLite (desktop profile) — checks
    # Plan 227 T1 follow-up: partition integrity, the spawner teardown gate and
    # the contract drift gate read the tree, not the shard artifacts, so they
    # must not be serialised behind the shards. No `needs`: this job overlaps
    # the shard matrix and joins the lane wall at max(shard, checks).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CAREER_APP_ENV: test
      CAREER_DATABASE_URL: sqlite+aiosqlite:///./neuronection_career_test.db
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      CAREER_MOCK_AI: "1"
      CAREER_RATELIMIT_AI: "0"
      CAREER_RATELIMIT_ENABLED: "false"
      CAREER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Partition integrity (no test lost, none doubled)
        # Global, never per shard: `-o addopts=""` pins the collection format
        # (the repo's addopts print a tree, and grepping a tree would let this
        # step pass while a lane lost its tests).
        run: |
          set -o pipefail
          uv run pytest tests --collect-only -q -o addopts="" | grep '::' | sort > /tmp/all.txt
          uv run pytest tests -m "not serial" --collect-only -q -o addopts="" | grep '::' | sort > /tmp/par.txt
          # The serial lane may legitimately select nothing (pytest exit 5);
          # every other failure of the serial collection must stop the step.
          ser_status=0
          uv run pytest tests -m serial --collect-only -q -o addopts="" > /tmp/ser.collect || ser_status=$?
          if [[ "$ser_status" -ne 0 && "$ser_status" -ne 5 ]]; then
            echo "serial collection failed with exit $ser_status" >&2
            cat /tmp/ser.collect >&2
            exit "$ser_status"
          fi
          if grep -q '::' /tmp/ser.collect; then
            grep '::' /tmp/ser.collect | sort > /tmp/ser.txt
          else
            : > /tmp/ser.txt
          fi
          test -s /tmp/par.txt || { echo "the parallel lane collected nothing" >&2; exit 1; }
          test -s /tmp/all.txt || { echo "the full collection is empty" >&2; exit 1; }
          if ! cat /tmp/par.txt /tmp/ser.txt | sort | diff - /tmp/all.txt; then
            echo "partition integrity failed: parallel + serial must cover the full collection exactly once" >&2
            exit 1
          fi
      - name: Spawner teardown gate (unraisable leaks fatal)
        run: >
          uv run pytest
          tests/test_extension_sources.py tests/test_mcp_connector.py
          tests/test_subprocess_teardown.py tests/test_ai_tools.py
          -W error::pytest.PytestUnraisableExceptionWarning
      - name: Contract drift gate (identity-auth §18)
        run: uv run pytest -m contract

  backend-sqlite-gate:
    name: Backend on SQLite (desktop profile) — gate
    needs: [backend-sqlite, backend-sqlite-checks]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CAREER_APP_ENV: test
      CAREER_DATABASE_URL: sqlite+aiosqlite:///./neuronection_career_test.db
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      CAREER_MOCK_AI: "1"
      CAREER_RATELIMIT_AI: "0"
      CAREER_RATELIMIT_ENABLED: "false"
      CAREER_SCHEDULER_ENABLED: "false"
    steps:
      - name: Require the shards and the tree-only checks
        # The lane's aggregate must mean "tests + checks + coverage": the
        # tree-only gates moved out of this job, so a red one has to fail this
        # job even though `if: always()` keeps it reachable.
        if: always()
        # The job default is `backend/`, which checkout has not created yet:
        # without this override GitHub cannot even start the process.
        working-directory: .
        env:
          SHARDS: ${{ needs.backend-sqlite.result }}
          CHECKS: ${{ needs.backend-sqlite-checks.result }}
        run: |
          for result in "$SHARDS" "$CHECKS"; do
            if [[ "$result" != "success" ]]; then
              echo "a required upstream job did not succeed: $result" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Download shard coverage
        uses: actions/download-artifact@v7
        with:
          pattern: sqlite-coverage-*
          path: backend
          merge-multiple: true
      - name: Download shard skip observations
        uses: actions/download-artifact@v7
        with:
          pattern: sqlite-observations-*
          path: /tmp/observations
      - name: Merge shard skip observations
        # The serial lane finishes the partition, so its completeness check
        # needs the union of every shard's parallel observations. The union is
        # a dict merge per shard; a missing fragment fails closed.
        run: >
          python3 ../scripts/check-test-shards.py --merge-observations
          /tmp/observations/sqlite-observations-1/skip_observations.json
          /tmp/observations/sqlite-observations-2/skip_observations.json
      - name: Combine shard coverage
        # Explicit inputs: a missing shard artifact is an error, not a pass.
        run: uv run coverage combine .coverage.shard-1 .coverage.shard-2
      - name: Run tests — serial lane (whole tree, single process)
        # `tests` (the whole tree) is required: the conftest judges skip-wall
        # completeness only for a whole-tree selection with no `-k`.
        run: uv run pytest tests -m serial --cov=app --cov-append --cov-report=
      - name: Coverage floor (whole suite, both shards)
        # The floor is enforced here and only here: no shard pass carries
        # --cov-fail-under, so a selectable pass cannot take it with it.
        run: uv run coverage report --fail-under=79 --skip-covered

  frontend:
    name: Frontend (lint + build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated wire types drift (regenerate + diff)
        run: npm run check:api
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test (coverage floor)
        run: npm run test -- --run --coverage
      - name: Dependency audit (npm audit, blocking with reviewed allowlist)
        run: python ../scripts/check-dependency-audit.py --ecosystem npm

  quality-gates:
    name: Quality gates (drift + gate policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: assistant-ui drift audit (required on every PR)
        run: node scripts/audit-assistant-ui-usage.mjs ./frontend/src
      - name: Dependency-audit allowlist policy self-test
        run: python3 scripts/check-dependency-audit.py --self-test
      - name: Mypy ratchet policy self-test
        run: python3 scripts/check-mypy-ratchet.py --self-test
      - name: Translation catalogs (de/el completeness)
        run: python3 scripts/translations/check_translations.py

  packaging:
    name: Packaging (PyInstaller bundle + smoke)
    # 22.04 keeps the bundled libpython loadable on glibc 2.35 hosts —
    # mirrors the release job (see the comment there).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config file xvfb
          # pygobject >= 3.58 builds against girepository-2.0 (Ubuntu 24.04+)
          if apt-cache show libgirepository-2.0-dev >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libgirepository-2.0-dev
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install backend build dependencies
        run: uv sync --frozen --extra desktop --extra pdf --extra sqlite
      - name: Build bundle
        run: ./packaging/build-linux.sh bundle
      - name: Smoke test frozen bundle (headless web mode)
        run: |
          trap 'echo "=== smoke.log ==="; cat smoke.log; echo "=== bundle SPA dist ==="; ls -la backend/dist/careerassistant/_internal/frontend/dist/ || true' EXIT
          CAREER_DATA_DIR="$PWD/packaging/_smoke" CAREER_SKIP_SEED=1 CAREER_API_PORT=8199 \
            timeout 30 backend/dist/careerassistant/careerassistant web > smoke.log 2>&1 &
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8199/health > health.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [[ -z "$ok" ]]; then echo "server never became healthy" >&2; exit 1; fi
          grep '"status": *"ok"' health.json
          curl -fsS http://127.0.0.1:8199/ | grep -q 'id="root"'
          # Unknown /api/v1 routes must return a JSON error, never the SPA
          # shell. `web` mode arms the §11 shell-token gate, so an
          # unauthenticated curl is refused (403) before routing could 404.
          resp="$(curl -sS -o notfound.json -w '%{http_code} %{content_type}' \
            http://127.0.0.1:8199/api/v1/definitely-not-a-route)"
          [[ "$resp" =~ ^(403|404)\ application/json ]]
          grep -q '"detail"' notfound.json
      - name: Smoke test desktop launch under xvfb (frozen bundle)
        run: |
          set +e
          CAREER_DATA_DIR="$PWD/packaging/_smoke-desktop" CAREER_SKIP_SEED=1 \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            timeout 30 xvfb-run -a \
            backend/dist/careerassistant/careerassistant \
            > desktop-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "desktop launch exited with $code (expected 124 = survived):" >&2
            cat desktop-smoke.log >&2
            exit 1
          fi
          echo "desktop launch survived 30s"

  docker:
    name: Docker (build image + validate compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: career-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production compose file
        run: |
          cp docker/.env.production.example docker/.env
          docker compose -f docker/docker-compose.prod.yml config -q
      - name: Image carries git (extension sources fetch at runtime)
        run: docker run --rm --entrypoint git career-assistant:ci --version
      - name: Smoke test image (boot + /health)
        run: |
          docker network create smoke >/dev/null
          docker run -d --name pg --network smoke \
            -e POSTGRES_DB=neuronection_career -e POSTGRES_USER=neuronection_career_owner -e POSTGRES_PASSWORD=smoke \
            postgres:16-alpine >/dev/null
          # The migrate one-shot runs once and exits, so wait for postgres
          # to accept statements first (mirrors the compose healthcheck).
          until docker exec pg pg_isready -U neuronection_career_owner -d neuronection_career >/dev/null 2>&1; do sleep 1; done
          # Fresh per-run keys: the boot guard (§8) refuses committed
          # dev/test fixtures, so smoke keys must be strong and distinct.
          SESSION_KEY="$(openssl rand -hex 32)"
          REFRESH_KEY="$(openssl rand -hex 32)"
          DATA_KEY="$(openssl rand -base64 32 | tr '+/' '-_')"
          # Plan 64 §1.1: the image never guesses — provisioning is an
          # explicit one-shot (`migrate`) and `serve` never migrates, so
          # the smoke must run the same sequence compose runs.
          docker run --rm --name migrate --network smoke \
            -e CAREER_DATABASE_URL=postgresql+asyncpg://neuronection_career_owner:smoke@pg:5432/neuronection_career \
            -e CAREER_SESSION_KEY="$SESSION_KEY" \
            -e CAREER_REFRESH_KEY="$REFRESH_KEY" \
            -e CAREER_DATA_KEY="$DATA_KEY" \
            career-assistant:ci migrate
          docker run -d --name app --network smoke -p 8100:8100 \
            -e CAREER_DATABASE_URL=postgresql+asyncpg://neuronection_career_owner:smoke@pg:5432/neuronection_career \
            -e CAREER_SESSION_KEY="$SESSION_KEY" \
            -e CAREER_REFRESH_KEY="$REFRESH_KEY" \
            -e CAREER_DATA_KEY="$DATA_KEY" \
            career-assistant:ci >/dev/null
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/health; then exit 0; fi
            sleep 2
          done
          echo "App did not become healthy" >&2
          docker logs app
          exit 1

  e2e:
    name: E2E (Playwright smoke over mock AI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neuronection_career_e2e
          POSTGRES_USER: neuronection_career_owner
          POSTGRES_PASSWORD: career_dev_pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neuronection_career_owner -d neuronection_career_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CAREER_APP_ENV: test
      CAREER_DATABASE_URL: postgresql+asyncpg://neuronection_career_owner:career_dev_pw@127.0.0.1:5433/neuronection_career_e2e
      CAREER_SESSION_KEY: test-session-key-0123456789abcdefghijklmnopqrstuv
      CAREER_REFRESH_KEY: test-refresh-key-0123456789abcdefghijklmnopqrstuv
      CAREER_DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      CAREER_MOCK_AI: "1"
      CAREER_RATELIMIT_AI: "0"
      CAREER_RATELIMIT_ENABLED: "false"
      CAREER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install backend deps + Playwright
        run: |
          uv sync --frozen --extra pdf --extra sqlite
          uv run --directory backend playwright install --with-deps chromium
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run E2E smoke
        run: bash scripts/run-e2e.sh
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            /tmp/career-e2e-server.log
            test-results/
          if-no-files-found: ignore

  docs-sync:
    name: Docs sync (CHANGELOG gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: User-visible changes must update CHANGELOG.md
        run: |
          BASE="$(git merge-base HEAD "origin/${{ github.event.pull_request.base.ref }}")"
          scripts/check-changelog.sh "$BASE"
