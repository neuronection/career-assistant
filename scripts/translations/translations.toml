# translations.toml — repo-specific facts for check_translations.py (edit
# this file, not the script). Secrets live in .env — never here.
#
# i18next + en.json catalog. Adoption is incremental — surfaces without
# t() calls are simply not audited yet (vitest i18n-audit.test.ts is the
# code-level gate).

[project]
name = "Career Assistant"

[source]
locale = "en"

[dictionaries]
dir = "frontend/src/locales"
format = "json"
# locales: omit to auto-detect <locale>.json files in dir (en.json = source).

[prompts]
dir = "scripts/translations/prompts"

[llm]
temperature = 0.3
timeout = 60
max_tokens = 4096
batch_size = 20
concurrency = 3
retries = 3

[gate]
fail_on_extra = true

[locales.el]
name = "Greek"

[locales.de]
name = "German"
