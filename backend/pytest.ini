[pytest]
testpaths = tests
pythonpath = .
env_files =
    .env.test
    .env
addopts = -v --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Watchdog: a hung test (e.g. an endpoint that never finishes its response)
# fails with a stack dump instead of freezing the whole session.
timeout = 120
timeout_method = signal
