name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: matchjob_test
          POSTGRES_USER: matchjob
          POSTGRES_PASSWORD: matchjob_dev_pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U matchjob -d matchjob_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://matchjob:matchjob_dev_pw@127.0.0.1:5433/matchjob_test
      JWT_SECRET: test-secret-not-for-production-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          ruff check app tests careerassistant
          ruff format --check app tests careerassistant
      - name: Migrate test database
        run: alembic upgrade head
      - name: Run tests
        run: pytest tests/
      - name: Dependency audit (pip-audit, advisory)
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  backend-sqlite:
    name: Backend on SQLite (desktop profile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./matchjob_test.db
      JWT_SECRET: test-secret-not-for-production-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt aiosqlite
      - name: Lint (ruff)
        run: |
          ruff check app tests careerassistant
          ruff format --check app tests careerassistant
      - name: Migrate test database
        run: python -m alembic upgrade head
      - name: Run tests
        run: python -m pytest tests/

  frontend:
    name: Frontend (lint + build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test -- --run
      - name: Dependency audit (npm audit, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  packaging:
    name: Packaging (PyInstaller bundle + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install backend build dependencies
        working-directory: backend
        run: |
          python -m venv venv
          ./venv/bin/pip install -r requirements.txt aiosqlite pywebview pyinstaller
      - name: Build bundle
        run: ./packaging/build-linux.sh bundle
      - name: Smoke test frozen bundle (headless web mode)
        run: |
          trap 'echo "=== smoke.log ==="; cat smoke.log; echo "=== bundle SPA dist ==="; ls -la backend/dist/careerassistant/_internal/frontend/dist/ || true' EXIT
          DATA_DIR="$PWD/packaging/_smoke" MJA_SKIP_SEED=1 API_PORT=8199 \
            timeout 30 backend/dist/careerassistant/careerassistant web > smoke.log 2>&1 &
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8199/health > health.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [[ -z "$ok" ]]; then echo "server never became healthy" >&2; exit 1; fi
          grep '"status": *"ok"' health.json
          curl -fsS http://127.0.0.1:8199/ | grep -q 'id="root"'
          # Unknown /api/v1 routes must be JSON 404s, not SPA fallbacks.
          # No curl -f here: the 404 is the expected outcome.
          resp="$(curl -sS -o notfound.json -w '%{http_code} %{content_type}' \
            http://127.0.0.1:8199/api/v1/definitely-not-a-route)"
          [[ "$resp" == "404 application/json"* ]]
          grep -q "Not Found" notfound.json

  docker:
    name: Docker (build image + validate compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: career-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production compose file
        run: |
          cp docker/.env.production.example docker/.env
          docker compose -f docker/docker-compose.prod.yml config -q
      - name: Smoke test image (boot + /health)
        run: |
          docker network create smoke >/dev/null
          docker run -d --name pg --network smoke \
            -e POSTGRES_DB=career -e POSTGRES_USER=career -e POSTGRES_PASSWORD=smoke \
            postgres:16-alpine >/dev/null
          docker run -d --name app --network smoke -p 8100:8100 \
            -e DATABASE_URL=postgresql+asyncpg://career:smoke@pg:5432/career \
            -e JWT_SECRET=smoke-secret-not-for-production-0123456789abcdef012345 \
            career-assistant:ci >/dev/null
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/health; then exit 0; fi
            sleep 2
          done
          echo "App did not become healthy" >&2
          docker logs app
          exit 1
